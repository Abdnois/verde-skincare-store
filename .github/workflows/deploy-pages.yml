name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check API base URL variable
        run: |
          if [ -z "${VITE_API_BASE}" ]; then
            echo "::error::Repository variable VITE_API_BASE is not set. Configure it in Settings -> Secrets and variables -> Actions -> Variables before deploying."
            exit 1
          fi
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4